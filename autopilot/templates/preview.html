<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LinkedIn Draft Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8e9ec;
      --muted: #9aa0ab;
      --accent: #0a66c2;
      --danger: #b3261e;
      --border: #2a2d36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .category {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: rgba(10, 102, 194, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .body-text {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #approve-btn { background: var(--accent); color: white; }
    #reject-btn { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card" id="card" data-token="{{ token }}">
    <span class="category">{{ draft['category'] }}</span>
    <div class="body-text">{{ draft['body'] }}</div>
    <div class="actions">
      <button id="approve-btn">Approve</button>
      <button id="reject-btn">Reject</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script src="{{ url_for('static', filename='preview.js') }}"></script>
</body>
</html>
